name: realtime-beforeinfo
on:
  schedule:
    - cron: '3-58/5 23,0-11 * * *'   # JST 8:00-20:59 の5分ごとに起動(1回25分動く・1分ごと)
  workflow_dispatch: {}
concurrency: realtime
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 32
    steps:
      - uses: actions/checkout@v4
      - name: fetch
        env:
          KEY: ${{ secrets.XSERVER_KEY }}
        run: |
          # 1回の起動で約25分、1分ごとに取って送る(次の起動は concurrency で前の回が終わるまで待つ)
          for i in $(seq 1 25); do
            python3 sync.py list || true
            python3 realtime.py || true
            python3 sync.py push || true
            sleep 45
          done
