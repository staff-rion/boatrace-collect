name: realtime-beforeinfo
on:
  schedule:
    - cron: '*/5 23,0-11 * * *'   # JST 8:00-20:59 の5分ごと
  workflow_dispatch: {}
concurrency: realtime
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: fetch
        env:
          KEY: ${{ secrets.XSERVER_KEY }}
        run: |
          python3 sync.py list || true
          python3 realtime.py
          python3 sync.py push
